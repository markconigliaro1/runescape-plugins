# Push a tag like hello-world/v1.2.0 to build that plugin's upload zip and
# attach it to a GitHub Release. Uploading to mod.io stays manual: don't
# change files on mod.io while a version is in moderation.
name: Release

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install dkjson
      - name: Read plugin and version from the tag
        id: tag
        run: |
          echo "plugin=${GITHUB_REF_NAME%%/v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*/v}" >> "$GITHUB_OUTPUT"
      - name: Validate for release
        run: lua tools/validate.lua --release "plugins/${{ steps.tag.outputs.plugin }}"
      - name: Package
        id: pkg
        run: echo "zip=$(tools/package.sh '${{ steps.tag.outputs.plugin }}' '${{ steps.tag.outputs.version }}')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes
